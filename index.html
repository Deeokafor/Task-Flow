<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, clean, and interactive Todo Application built with HTML, CSS, and Vanilla JavaScript.">
  <title>Taskflow - Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <h1>Taskflow</h1>
      </div>
      <p class="subtitle">Organize your daily workflow effortlessly</p>
    </header>

    <!-- Main Content Card -->
    <main class="todo-card">
      <!-- Input Section -->
      <form id="todo-form" class="todo-form">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="todo-input" 
            placeholder="Add a new task..." 
            autocomplete="off"
            required
          >
          <button type="submit" id="add-btn" class="btn-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add</span>
          </button>
        </div>
      </form>

      <!-- Controls & Filter Bar -->
      <div class="controls-bar">
        <div class="filter-tabs">
          <button class="filter-btn active" data-filter="all" id="filter-all">All</button>
          <button class="filter-btn" data-filter="active" id="filter-active">Active</button>
          <button class="filter-btn" data-filter="completed" id="filter-completed">Completed</button>
        </div>
        <button id="clear-completed-btn" class="btn-text" title="Clear completed tasks">
          Clear Completed
        </button>
      </div>

      <!-- Task List -->
      <ul id="todo-list" class="todo-list" aria-live="polite">
        <!-- Dynamic Todo Items will be rendered here -->
      </ul>

      <!-- Footer Stats -->
      <footer class="card-footer">
        <span id="items-count" class="items-count">0 tasks left</span>
      </footer>
    </main>
  </div>

  <script src="index.js"></script>
</body>
</html>
