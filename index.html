<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Taskflow - Secure, lightning-fast full-stack Todo application built with HTML, CSS, Vanilla JS, and Netlify Functions.">
  <title>Taskflow - Advanced Serverless Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <h1>Taskflow</h1>
        <span class="badge-status" id="backend-status" title="Connection status">API Ready ⚡</span>
      </div>
      <p class="subtitle">Secure, full-stack task management powered by Netlify</p>
    </header>

    <!-- Main Content Card -->
    <main class="todo-card">
      <!-- Search & Quick Tools -->
      <div class="search-bar-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search tasks by title..." autocomplete="off">
        <select id="category-filter" class="select-custom" aria-label="Filter by category">
          <option value="all">All Categories</option>
          <option value="General">General</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Dev">Dev</option>
        </select>
      </div>

      <!-- Task Input Form -->
      <form id="todo-form" class="todo-form">
        <div class="input-row-main">
          <input 
            type="text" 
            id="todo-input" 
            placeholder="What needs to be done?" 
            autocomplete="off"
            required
            maxlength="255"
          >
          <button type="submit" id="add-btn" class="btn-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add Task</span>
          </button>
        </div>

        <div class="input-row-meta">
          <div class="meta-field">
            <label for="todo-priority">Priority:</label>
            <select id="todo-priority" class="select-custom">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
          </div>

          <div class="meta-field">
            <label for="todo-category">Category:</label>
            <select id="todo-category" class="select-custom">
              <option value="General">General</option>
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Dev">Dev</option>
            </select>
          </div>

          <div class="meta-field">
            <label for="todo-duedate">Due Date:</label>
            <input type="date" id="todo-duedate" class="input-date">
          </div>
        </div>
      </form>

      <!-- Controls & Filter Bar -->
      <div class="controls-bar">
        <div class="filter-tabs">
          <button class="filter-btn active" data-filter="all" id="filter-all">All</button>
          <button class="filter-btn" data-filter="active" id="filter-active">Active</button>
          <button class="filter-btn" data-filter="completed" id="filter-completed">Completed</button>
        </div>
        <button id="clear-completed-btn" class="btn-text" title="Clear completed tasks">
          Clear Completed
        </button>
      </div>

      <!-- Task List -->
      <ul id="todo-list" class="todo-list" aria-live="polite">
        <!-- Dynamic Todo Items rendered here -->
      </ul>

      <!-- Footer Stats & Export -->
      <footer class="card-footer">
        <span id="items-count" class="items-count">0 tasks left</span>
        <div class="footer-actions">
          <button id="export-btn" class="btn-link" title="Export tasks to JSON file">Export JSON</button>
        </div>
      </footer>
    </main>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
